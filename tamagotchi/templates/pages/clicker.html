{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tamagochi | {% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/normalise.css' %}">
    <link rel="stylesheet" href="{% static 'css/tamagotchi-game.css' %}">
</head>
<body style="background-image: url('/static/img/clicker.png'); text-align: center;">
    <h2 id="num_of_click" class="pixel-background center-margin">Кол-во: {{ mood_tamagotchi.number_of_click }}</h2>
    <div id="click_button" onclick="make_click()"></div>
    <script src="{% static 'js/clicker.js' %}"></script>
    <a href="/tamagotchi/" class="pixel-background center-margin">Вернуться</a>
</body>
</html>
